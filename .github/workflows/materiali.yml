name: Aggiorna materiali

# Downloads the rubber and blade ratings from revspin.net into the "data" branch, then publishes the site
# (build.yml). Independent from the rankings: one can fail without stopping the other.
on:
  schedule:
    - cron: '0 7 1 * *'   # the 1st of every month, 07:00 UTC
  workflow_dispatch:       # "Run workflow" button for manual updates

permissions:
  contents: write
  actions: write           # to start build.yml

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scarica gomme e telai da revspin.net
        run: node revspin.js --fetch

      - name: Salva i dati
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Materiali $(date -u +%F)"
          git pull --rebase -q
          git push

      - name: Pubblica il sito
        run: gh workflow run build.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
