name: Aggiorna classifica

# Downloads the rankings from portale.fitet.org into the "data" branch, then publishes the site (build.yml).
on:
  schedule:
    - cron: '0 6 1 * *'   # the 1st of every month, 06:00 UTC (FITET publishes a new ranking about once a month)
  workflow_dispatch:       # "Run workflow" button for manual updates

permissions:
  contents: write
  actions: write           # to start build.yml

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scarica i dati da portale.fitet.org
        run: node fitet.js --fetch

      # The data branch keeps the history of the data: each update is a commit.
      - name: Salva i dati
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Classifica $(date -u +%F)"
          git pull --rebase -q
          git push

      - name: Pubblica il sito
        run: gh workflow run build.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
