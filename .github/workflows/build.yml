name: Pubblica sito

# Builds the pages from the saved data (the "data" branch) and publishes them on GitHub Pages.
# No request to FITET or revspin: a change to the pages or the scripts is online in about a minute.
# The two data workflows (update.yml, materiali.yml) run this after saving new data.
on:
  push:
    branches: [main]
    paths: [fitet.js, template.html, revspin.js, materiali.html, og.png, CNAME, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Genera le pagine dai dati salvati
        run: |
          node fitet.js --build
          node revspin.js --build
        env:
          GITHUB_TOKEN: ${{ github.token }}   # for the date of the last template change (GitHub API)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
