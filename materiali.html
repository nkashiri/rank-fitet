<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e2e1dc; --accent: #2563eb; --hover: #f0efe9; --grid: rgba(0,0,0,.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993;
      --border: #34332f; --accent: #60a5fa; --hover: #2a2926; --grid: rgba(255,255,255,.12);
    }
  }
  :root[data-theme="dark"] {
    --bg: #161614; --panel: #1f1f1d; --text: #ecebe6; --muted: #9a9993;
    --border: #34332f; --accent: #60a5fa; --hover: #2a2926; --grid: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 40px; }
  a { color: var(--accent); }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 14px; margin: 0; }
  header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  header.top .logo { flex: none; width: 36px; height: 36px; }
  header.top > div { flex: 1; min-width: 0; }
  header.top .back { flex: none; font-size: 13px; text-decoration: none; }
  header.top .lang { flex: none; }
  header.top .lang button { padding: 3px 8px; font-size: 12px; }
  .sub { color: var(--muted); font-size: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  select, input, button, summary { font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  input[type=search] { flex: 1 1 180px; min-width: 0; }
  button { cursor: pointer; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  .ms { position: relative; }
  .ms summary { list-style: none; cursor: pointer; white-space: nowrap; max-width: 260px;
                overflow: hidden; text-overflow: ellipsis; }
  .ms summary::-webkit-details-marker { display: none; }
  .ms summary::after { content: " ▾"; color: var(--muted); }
  .ms.active summary { border-color: var(--accent); color: var(--accent); }
  .ms .panel { position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; width: 300px; max-width: calc(100vw - 32px);
               background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
               box-shadow: 0 6px 24px rgba(0,0,0,.15); }
  .ms .panel input[type=search] { width: 100%; margin-bottom: 6px; }
  .ms .opts { max-height: 300px; overflow-y: auto; }
  .ms label { display: flex; gap: 6px; align-items: baseline; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
  .ms label:hover { background: var(--hover); }
  .ms label input { flex: none; margin: 0; }
  .ms label span { flex: 1; }
  .ms label small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .ms .reset { margin-top: 6px; font-size: 12px; padding: 3px 8px; }
  .ranges { display: grid; grid-template-columns: 1fr 72px 72px; gap: 4px 6px; align-items: center; font-size: 13px; }
  .ranges .h { color: var(--muted); font-size: 11px; text-align: center; }
  .ranges input { width: 100%; padding: 4px 6px; font-variant-numeric: tabular-nums; }
  .ranges input.on { border-color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  .cmp-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px;
          padding: 2px 4px 2px 10px; font-size: 13px; max-width: 100%; }
  .chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip button { border: 0; padding: 0 6px; background: none; color: var(--muted); font-size: 15px; line-height: 1; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .cmp-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .radar { position: relative; height: 420px; }
  .axes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .axes button { font-size: 12px; padding: 2px 8px; border-radius: 999px; color: var(--muted); }
  .axes button.on { border-color: var(--accent); color: var(--accent); }
  .hint { color: var(--muted); font-size: 13px; margin: 4px 0; }
  .tablewrap { overflow: auto; max-height: 75vh; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  #list th { color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 2; background: var(--panel); }
  #list th.sorted { color: var(--accent); }
  #list .name { position: sticky; left: 0; background: var(--panel); z-index: 1; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  #list th.name { z-index: 3; }
  #list tbody tr { cursor: pointer; }
  #list tbody tr:hover td, #list tbody tr:hover .name { background: var(--hover); }
  #list tbody tr.sel .name { box-shadow: inset 3px 0 0 var(--c); }
  .name input { margin: 0 6px 0 0; vertical-align: -2px; }
  .brand { color: var(--muted); }
  .ext { text-decoration: none; margin-left: 4px; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.mat { max-width: 220px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .muted { color: var(--muted); }
  #cmp-table th { font-weight: 600; color: var(--muted); }
  #cmp-table thead th { color: var(--text); vertical-align: bottom; white-space: normal; min-width: 90px; }
  #cmp-table td.best { font-weight: 700; color: var(--accent); }
  #cmp-table td:not(.num) { white-space: normal; min-width: 90px; font-size: 12px; }
  .cmp-tablewrap { overflow-x: auto; }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .info { display: inline-block; margin-left: 3px; color: var(--muted); font-size: 11px; font-weight: 400; cursor: help;
          line-height: 1; vertical-align: 1px; border-radius: 50%; }
  .info:hover, .info:focus-visible { color: var(--accent); outline: none; }
  .tip { position: fixed; z-index: 50; max-width: min(320px, calc(100vw - 16px)); background: var(--panel); color: var(--text);
         border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.45;
         box-shadow: 0 6px 24px rgba(0,0,0,.18); white-space: normal; text-align: left; font-weight: 400; }
  .tip b { display: block; margin-bottom: 3px; font-size: 13px; }
  .tip table { margin-top: 6px; width: auto; font-size: 12px; }
  .tip td { padding: 2px 10px 2px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .tip .note { margin-top: 6px; color: var(--muted); }
  footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  footer p { margin: 4px 0; }
  @media (max-width: 900px) {
    .cmp-body { grid-template-columns: 1fr; }
    .radar { height: 340px; }
  }
  @media (max-width: 600px) {
    header.top .logo { width: 30px; height: 30px; }
    header.top { flex-wrap: wrap; }
    #list .name { max-width: 170px; }
    .radar { height: 300px; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2563eb"/>
      <polygon points="16,6 25,12 22,23 10,23 7,12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="16" cy="14" r="3" fill="#fbbf24"/></svg>
    <div><h1 data-t="title"></h1><div class="sub" id="sub"></div></div>

  </header>

  <div class="controls">
    <div class="seg" id="kind"><button data-k="rubber" data-t="rubbers"></button><button data-k="blade" data-t="blades"></button></div>
    <input type="search" id="q">
  </div>
  <div class="controls" id="filters"></div>

  <section class="card" id="cmp">
    <div class="cmp-head">
      <h2 data-t="compare"></h2>
      <div class="chips" id="chips"></div>
      <button id="clear" data-t="clear" hidden></button>
    </div>
    <p class="hint" id="cmp-hint" data-t="cmpHint"></p>
    <div class="cmp-body" id="cmp-body" hidden>
      <div>
        <div class="radar"><canvas id="radar"></canvas></div>
        <div class="axes" id="axes"></div>
      </div>
      <div class="cmp-tablewrap"><table id="cmp-table"></table></div>
    </div>
  </section>

  <div class="controls"><span class="count" id="count"></span></div>
  <div class="tablewrap"><table id="list"><thead></thead><tbody></tbody></table></div>

  <footer>
    <p data-t="foot1"></p>
    <p data-t="foot2"></p>
    <p id="updinfo"></p>
    <p data-t="foot3"></p>
  </footer>
</main>

// Explanations shown by the ⓘ icons (HTML): per language, per kind, then common to both kinds.

const scale = rows => `<table>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
const TIPS = {
  it: {

      throw_angle: 'The angle at which the ball leaves the racket on topspin strokes like the loop: a high throw angle lifts the ball higher. Tacky rubbers often have a higher throw angle.' +
        scale([['9+', 'Very high'], ['7 – 9', 'High'], ['5.5 – 7', 'Medium-high'], ['3.5 – 5.5', 'Medium'], ['1.5 – 3.5', 'Medium-low'], ['under 1.5', 'Low']]) +
        '<div class="note">Topspin strokes only: on an underspin chop, the same high-throw rubber produces a very low angle (it is reversed).</div>',
      durability: 'How long the product lasts: do you have to replace it often, or does it last for years?',
      type: '<b>Tensor</b>: pre-tensioned topsheet, with a built-in catapult effect that increases speed and spin.<br><b>Non-tensor</b>: normal rubber, with no extra tension.<br><b>Anti</b>: nearly frictionless surface, often slow, for a defensive style of play.<br><b>n/a</b>: not available.',
      m_speed: 'Speed stated by the manufacturer, rescaled to 0–10. Each brand uses its own scale, so it is only comparable between models of the same brand.',
      m_spin: 'Spin stated by the manufacturer, rescaled to 0–10. Each brand uses its own scale, so it is only comparable between models of the same brand.',
    },
    blade: {
      speed: 'The power generated by the blade. It covers loop speed and volley speed (flat contact, like a smash or volley). A faster blade produces faster shots which, at high speeds, reduces control.',
      stiffness: 'The blade\'s flexibility. Flexible blades (low values) have a longer dwell time, generating more spin, and also perform well for mid-distance looping. Stiff blades (high values) are better for smashing.',
      hardness: 'The blade\'s hardness. Hard blades (high values) are often faster, soft ones generally slower; soft blades have a longer dwell time, generating more spin.',
      weight_g: 'Weight stated by the manufacturer, in grams. The actual weight can vary by a few grams from one blade to another.',
      plies: 'The number of layers of wood and composite material in the blade, as stated by the manufacturer.',
      materials: 'The types of wood and composite material in the blade, as stated by the manufacturer (often missing).',
      mats: 'Fibre families, from the materials and the model name: Carbon, Arylate (ALC), Zylon (ZLC), Kevlar, other fibres (glass, titanium, ...). "All-wood": materials given, with no fibre. "n/a": no materials given.',
    },
    common: {
      control: 'How easy it is to control the ball with this equipment. Equipment that is too fast or too spinny reduces control, but equipment that is too slow or not spinny may also decrease it.',
      consistency: 'How consistent the product is: if you buy the same product in two different years, do they perform the same? Lower quality control lowers it.',
      overall: 'The overall rating revspin users give the product.',
      ratings: 'The number of revspin users who rated the model: more ratings, more reliable data. Only models with at least 10 are listed here.',
      price: 'Approximate price in US dollars, reported by revspin users.',
    },
  },
};

// --- Language: saved choice, else the address ("#l=en"), else the browser's language ---

const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const hash = new URLSearchParams(location.hash.slice(1));
let lang = ['it', 'en'].find(l => l === hash.get('l')) || ['it', 'en'].find(l => l === store.get('lang')) ||
  (/^it\b/i.test(navigator.language || 'it') ? 'it' : 'en');
const t = k => TEXT[lang][k];
const label = k => TEXT[lang].labels[k][0];
const short = k => TEXT[lang].labels[k][1] || TEXT[lang].labels[k][0];
const val = v => TEXT[lang].values[v] ?? v;

// --- Data ---

// Rating parameters (0-10) of each kind, in table order.
const PARAMS = {
  rubber: ['speed', 'spin', 'control', 'tackiness', 'weight', 'sponge_hardness', 'gears', 'throw_angle', 'consistency', 'durability', 'overall'],
  blade: ['speed', 'control', 'stiffness', 'hardness', 'consistency', 'overall'],
};
// Parameters where more is better (highlighted in the comparison); the others are a matter of style.
const BETTER = new Set(['speed', 'spin', 'control', 'gears', 'consistency', 'durability', 'overall']);
const COLORS = ['#2563eb', '#dc2626', '#16a34a', '#d97706', '#9333ea', '#0891b2'];
const MAX_SEL = 6;

// Blade materials (free text from the manufacturer, often missing), grouped into fibre families for the filter.
// The model name is checked too ("... ALC", "... ZLC", "... Carbon"). "wood": materials given, no fibre.
const MATS = [
  ['zlc', /zylon|zlc|zlf|\bzl\b/i],
  ['alc', /aryl|\balc\b|vectran/i],
  ['kevlar', /kevlar|aramid|carbokev|aratox/i],
  ['carbon', /carbon|karbon|\bcarbo|tamca|texalium|textreme|dyneema|\bcf\b/i],
  ['other', /glass|basalt|titan|ceramic|synthetic|cellulose|nature powered/i],
];
const FIBRE = new RegExp([...MATS.map(([, re]) => re.source), 'fib(er|re)'].join('|'), 'i');
for (const b of DATA.blade) {
  const text = `${b.materials} ${b.model}`;
  b.mats = MATS.filter(([, re]) => re.test(text)).map(([c]) => c);
  if (!b.mats.length) b.mats.push(!b.materials ? 'na' : FIBRE.test(b.materials) ? 'other' : 'wood');
}
for (const r of DATA.rubber) r.type = r.anti ? 'anti' : r.tensor ? 'tensor' : r.tensor === false ? 'nontensor' : 'na';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmt = (v, d = 1) => v == null ? '–' : lang === 'it' ? v.toFixed(d).replace('.', ',') : v.toFixed(d);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// Filter and selection state, per kind. The kind, the compared models and the language are kept in the address.
const blankFilters = () => ({ brand: new Set(), type: new Set(), plies: new Set(), mats: new Set(), min: {}, max: {} });
const st = {
  kind: hash.get('k') === 'blade' ? 'blade' : 'rubber', q: '',
  f: { rubber: blankFilters(), blade: blankFilters() },
  sort: { rubber: ['overall', -1], blade: ['overall', -1] },
  sel: { rubber: [], blade: [] },
  axes: { rubber: null, blade: null },
};
const items = () => DATA[st.kind];
const bySlug = {};
for (const k of ['rubber', 'blade']) { bySlug[k] = {}; for (const r of DATA[k]) bySlug[k][r.slug] = r; }
for (const k of ['rubber', 'blade']) {
  const s = hash.get(k === 'rubber' ? 'gomme' : 'telai');
  if (s) st.sel[k] = s.split(',').filter(x => bySlug[k][x]).slice(0, MAX_SEL);
}
function writeHash() {
  const h = new URLSearchParams();
  if (st.kind === 'blade') h.set('k', 'blade');
  if (st.sel.rubber.length) h.set('gomme', st.sel.rubber.join(','));
  if (st.sel.blade.length) h.set('telai', st.sel.blade.join(','));
  if (lang === 'en') h.set('l', 'en');
  history.replaceState(null, '', h.toString() ? '#' + h.toString().replace(/%2C/g, ',') : location.pathname);
}

const tipOf = k => TIPS[lang][st.kind][k] || TIPS[lang].common[k] || '';
// The ⓘ icon after a label: hover (or tap) shows the explanation of `k`.
const info = k => tipOf(k) ? `<span class="info" data-tip="${k}" tabindex="0" role="button" aria-label="${esc(`${t('whatIs')}: ${label(k)}`)}">ⓘ</span>` : '';

// --- Filters ---

// Numeric range filters: the 0-10 parameters plus ratings, price and (blades) weight. [key, decimals]
const rangeDefs = () => [...PARAMS[st.kind].map(k => [k, 1]), ['ratings', 0], ['price', 0], ...(st.kind === 'blade' ? [['weight_g', 0]] : [])];

// Multi-select dropdown: options [{v: code, n}], the chosen codes in `set`; `show` gives the visible name.
function multi(title, opts, set, { searchable, show = v => v } = {}) {
  const d = document.createElement('details');
  d.className = 'ms';
  const summary = () => {
    d.classList.toggle('active', set.size > 0);
    d.querySelector('summary').textContent = set.size ? `${title}: ${[...set].map(show).join(', ')}` : title;
  };
  d.innerHTML = `<summary></summary><div class="panel">${searchable ? `<input type="search" placeholder="${t('searchOpt')}">` : ''}<div class="opts"></div><button class="reset">${t('reset')}</button></div>`;
  const box = d.querySelector('.opts');
  const draw = (q = '') => {
    box.innerHTML = opts.filter(o => show(o.v).toLowerCase().includes(q.toLowerCase())).map(o =>
      `<label><input type="checkbox" value="${esc(o.v)}"${set.has(o.v) ? ' checked' : ''}><span>${esc(show(o.v))}</span><small>${o.n}</small></label>`).join('');
  };
  box.addEventListener('change', e => { e.target.checked ? set.add(e.target.value) : set.delete(e.target.value); summary(); render(); });
  d.querySelector('.reset').onclick = () => { set.clear(); draw(); summary(); render(); };
  if (searchable) d.querySelector('input[type=search]').oninput = e => draw(e.target.value);
  draw(); summary();
  return d;
}

const counts = vals => {
  const m = new Map();
  for (const v of vals) m.set(v, (m.get(v) || 0) + 1);
  return [...m].map(([v, n]) => ({ v: String(v), n }));
};

function buildFilters() {
  const f = st.f[st.kind], list = items(), box = $('#filters');
  box.innerHTML = '';
  box.append(multi(t('brand'), counts(list.map(r => r.brand)).sort((a, b) => b.n - a.n || a.v.localeCompare(b.v)), f.brand, { searchable: true }));
  if (st.kind === 'rubber') {
    box.append(multi(t('type'), counts(list.map(r => r.type)).sort((a, b) => b.n - a.n), f.type, { show: val }));
  } else {
    const plies = counts(list.map(r => r.plies ?? 'na')).sort((a, b) => (+a.v || 99) - (+b.v || 99));
    box.append(multi(t('plies'), plies, f.plies, { show: val }));
    box.append(multi(t('mats'), counts(list.flatMap(r => r.mats)).sort((a, b) => b.n - a.n), f.mats, { show: val }));
  }

  // Min/max panel for the numeric parameters.
  const d = document.createElement('details');
  d.className = 'ms';
  const defs = rangeDefs();
  const active = () => defs.some(([k]) => f.min[k] != null || f.max[k] != null);
  const summary = () => { d.classList.toggle('active', active()); d.querySelector('summary').textContent = t('params') + (active() ? ` (${t('active')})` : ''); };
  d.innerHTML = `<summary></summary><div class="panel" style="width:330px"><div class="ranges"><span></span><span class="h">min</span><span class="h">max</span>${
    defs.map(([k, dec]) => {
      const vals = list.map(r => r[k]).filter(v => v != null);
      const lo = Math.min(...vals), hi = Math.max(...vals);
      const step = dec ? '0.1' : '1';
      return `<span>${label(k)}${k === 'price' ? ' $' : ''}${info(k)}</span><input type="number" step="${step}" data-k="${k}" data-b="min" placeholder="${lo.toFixed(dec)}" value="${f.min[k] ?? ''}">` +
        `<input type="number" step="${step}" data-k="${k}" data-b="max" placeholder="${hi.toFixed(dec)}" value="${f.max[k] ?? ''}">`;
    }).join('')}</div><button class="reset">${t('reset')}</button></div>`;
  d.querySelector('.ranges').addEventListener('input', e => {
    const { k, b } = e.target.dataset, v = e.target.value === '' ? null : +e.target.value;
    if (v == null) delete f[b][k]; else f[b][k] = v;
    e.target.classList.toggle('on', v != null);
    summary(); render();
  });
  d.querySelectorAll('.ranges input').forEach(i => i.classList.toggle('on', i.value !== ''));
  d.querySelector('.reset').onclick = () => { f.min = {}; f.max = {}; d.querySelectorAll('.ranges input').forEach(i => { i.value = ''; i.classList.remove('on'); }); summary(); render(); };
  summary();
  box.append(d);

  const reset = document.createElement('button');
  reset.textContent = t('resetAll');
  reset.onclick = () => { st.f[st.kind] = blankFilters(); st.q = ''; $('#q').value = ''; buildFilters(); render(); };
  box.append(reset);
}

// Keep an open dropdown panel inside the window (on phones the right-hand ones would overflow).
document.addEventListener('toggle', e => {
  const panel = e.target.open && e.target.querySelector?.('.ms > .panel');
  if (!panel) return;
  panel.style.left = '0px';
  const over = panel.getBoundingClientRect().right - (innerWidth - 16);
  if (over > 0) panel.style.left = `${-over}px`;
}, true);

// Close a dropdown when clicking elsewhere.
document.addEventListener('click', e => {
  document.querySelectorAll('.ms[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; });
});

function filtered() {
  const f = st.f[st.kind], q = st.q.toLowerCase().trim();
  return items().filter(r =>
    (!q || r.name.toLowerCase().includes(q)) &&
    (!f.brand.size || f.brand.has(r.brand)) &&
    (!f.type.size || f.type.has(r.type)) &&
    (!f.plies.size || f.plies.has(String(r.plies ?? 'na'))) &&
    (!f.mats.size || r.mats.some(m => f.mats.has(m))) &&
    Object.entries(f.min).every(([k, v]) => r[k] != null && r[k] >= v) &&
    Object.entries(f.max).every(([k, v]) => r[k] != null && r[k] <= v));
}

// --- Table ---

// Columns: name, the 0-10 parameters, then ratings, price and the manufacturer details.
function columns() {
  const cols = PARAMS[st.kind].map(k => ({ k, num: 1, dec: 1, heat: 1 }));
  cols.push({ k: 'ratings', num: 1, dec: 0 }, { k: 'price', num: 1, dec: 0, pre: '$' });
  if (st.kind === 'blade') cols.push({ k: 'weight_g', num: 1, dec: 0, post: ' g' }, { k: 'plies', num: 1, dec: 0 }, { k: 'materials', mat: 1 });
  else cols.push({ k: 'type', code: 1 });
  return cols;
}

function renderTable(rows) {
  const cols = columns(), [sk, sd] = st.sort[st.kind], sel = st.sel[st.kind];
  const arrow = k => sk === k ? (sd > 0 ? ' ↑' : ' ↓') : '';
  $('#list thead').innerHTML = `<tr><th class="name${sk === 'name' ? ' sorted' : ''}" data-k="name">${t('model')}${arrow('name')}</th>${
    cols.map(c => `<th class="${c.num ? 'num' : ''}${sk === c.k ? ' sorted' : ''}" data-k="${c.k}">${short(c.k)}${arrow(c.k)}${info(c.k)}</th>`).join('')}</tr>`;
  // Shading of the 0-10 columns, relative to each column's range among all the models of this kind.
  const accent = css('--accent'), range = {};
  for (const c of cols.filter(c => c.heat)) {
    const vals = items().map(r => r[c.k]).filter(v => v != null);
    range[c.k] = [Math.min(...vals), Math.max(...vals)];
  }
  const shade = (k, v) => { const [lo, hi] = range[k]; return Math.round(32 * (v - lo) / ((hi - lo) || 1)); };
  $('#list tbody').innerHTML = rows.map(r => {
    const i = sel.indexOf(r.slug);
    const cells = cols.map(c => {
      const v = r[c.k];
      if (c.mat) return `<td class="mat" title="${esc(v)}">${esc(v) || '<span class="muted">–</span>'}</td>`;
      if (c.code) return `<td class="${v === 'na' ? 'muted' : ''}">${esc(val(v))}</td>`;
      const bg = c.heat && v != null ? ` style="background:color-mix(in srgb, ${accent} ${shade(c.k, v)}%, transparent)"` : '';
      return `<td class="num"${bg}>${v == null ? '<span class="muted">–</span>' : (c.pre || '') + fmt(v, c.dec) + (c.post || '')}</td>`;
    }).join('');
    return `<tr data-s="${r.slug}"${i >= 0 ? ` class="sel" style="--c:${COLORS[i]}"` : ''}><td class="name" title="${esc(r.name)}"><input type="checkbox"${i >= 0 ? ' checked' : ''}${i < 0 && sel.length >= MAX_SEL ? ' disabled' : ''}><span class="brand">${esc(r.brand)}</span> ${esc(r.model)}<a class="ext" href="https://revspin.net/${st.kind}/${r.slug}.html" target="_blank" rel="noopener" title="${t('revspinPage')}">↗</a></td>${cells}</tr>`;
  }).join('') || `<tr><td colspan="${cols.length + 1}" class="muted">${t('none')}</td></tr>`;
}

$('#list thead').addEventListener('click', e => {
  const th = e.target.closest('th[data-k]');
  if (!th) return;
  const s = st.sort[st.kind], k = th.dataset.k;
  st.sort[st.kind] = s[0] === k ? [k, -s[1]] : [k, k === 'name' || k === 'materials' || k === 'type' ? 1 : -1];
  render();
});
$('#list tbody').addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const tr = e.target.closest('tr[data-s]');
  if (tr) toggle(tr.dataset.s);
});

function toggle(slug) {
  const sel = st.sel[st.kind], i = sel.indexOf(slug);
  if (i >= 0) sel.splice(i, 1);
  else if (sel.length < MAX_SEL) sel.push(slug);
  writeHash(); render();
}

// --- Comparison: chips, radar chart and a side-by-side table of the selected models ---

let chart;
function renderCompare() {
  const sel = st.sel[st.kind].map(s => bySlug[st.kind][s]);
  $('#chips').innerHTML = sel.map((r, i) =>
    `<span class="chip"><span class="swatch" style="background:${COLORS[i]}"></span><span class="nm">${esc(r.name)}</span><button data-s="${r.slug}" title="${t('remove')}">×</button></span>`).join('');
  $('#clear').hidden = !sel.length;
  $('#cmp-hint').hidden = sel.length > 0;
  $('#cmp-body').hidden = !sel.length;
  if (!sel.length) { if (chart) { chart.destroy(); chart = null; } return; }

  const params = PARAMS[st.kind];
  if (!st.axes[st.kind]) st.axes[st.kind] = new Set(params.filter(k => k !== 'overall'));
  const axes = st.axes[st.kind];
  $('#axes').innerHTML = params.map(k => `<button data-k="${k}" class="${axes.has(k) ? 'on' : ''}">${label(k)}</button>`).join('');
  const shown = params.filter(k => axes.has(k));

  const text = css('--text'), muted = css('--muted'), grid = css('--grid');
  const datasets = sel.map((r, i) => ({
    label: r.name, data: shown.map(k => r[k]),
    borderColor: COLORS[i], backgroundColor: COLORS[i] + '22', pointBackgroundColor: COLORS[i], borderWidth: 2, pointRadius: 3,
  }));
  const cfg = {
    type: 'radar',
    data: { labels: shown.map(label), datasets },
    options: {
      maintainAspectRatio: false, animation: { duration: 250 },
      scales: { r: { min: 0, max: 10, ticks: { stepSize: 2, color: muted, backdropColor: 'transparent', font: { size: 10 } },
        grid: { color: grid }, angleLines: { color: grid }, pointLabels: { color: text, font: { size: 12 } } } },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmt(c.raw)}` } },
      },
    },
  };
  if (chart) chart.destroy();
  chart = new Chart($('#radar'), cfg);

  // Comparison table: one column per model, the best value of each "more is better" row highlighted.
  const rows = [...params.map(k => [k, 1]), ['ratings', 0], ['price', 0],
    ...(st.kind === 'blade' ? [['weight_g', 0], ['plies', 0], ['materials'], ['mats']] : [['type'], ['m_speed', 1], ['m_spin', 1]])];
  const best = (k, vals) => {
    const nums = vals.filter(v => typeof v === 'number');
    if (nums.length < 2) return null;
    if (BETTER.has(k) || k === 'ratings') return Math.max(...nums);
    if (k === 'price') return Math.min(...nums);
    return null;
  };
  $('#cmp-table').innerHTML = `<thead><tr><th></th>${sel.map((r, i) =>
    `<th><span class="swatch" style="background:${COLORS[i]}"></span> ${esc(r.name)}</th>`).join('')}</tr></thead><tbody>${
    rows.map(([k, dec]) => {
      const vals = sel.map(r => r[k]), b = best(k, vals);
      return `<tr><th>${label(k)}${info(k)}</th>${vals.map(v => {
        const shown = typeof v === 'number' ? (k === 'price' ? '$' : '') + fmt(v, dec)
          : Array.isArray(v) ? v.map(val).join(', ') : k === 'type' ? val(v) : (v || '–');
        return `<td class="${typeof v === 'number' ? 'num' : ''}${b != null && v === b ? ' best' : ''}">${esc(shown)}</td>`;
      }).join('')}</tr>`;
    }).join('')}</tbody>`;
}

$('#chips').addEventListener('click', e => { const b = e.target.closest('button[data-s]'); if (b) toggle(b.dataset.s); });
$('#clear').onclick = () => { st.sel[st.kind] = []; writeHash(); render(); };
$('#axes').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  const axes = st.axes[st.kind];
  if (axes.has(b.dataset.k)) { if (axes.size > 3) axes.delete(b.dataset.k); } else axes.add(b.dataset.k);
  renderCompare();
});

// --- Explanation tooltip of the ⓘ icons: on hover with a mouse, on tap on a touch screen ---

const tip = document.createElement('div');
tip.className = 'tip';
tip.hidden = true;
tip.setAttribute('role', 'tooltip');
document.body.append(tip);
let tipEl = null;
function showTip(el) {
  tipEl = el;
  tip.innerHTML = `<b>${esc(label(el.dataset.tip))}</b><div>${tipOf(el.dataset.tip)}</div>`;
  tip.hidden = false;
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = `${Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8))}px`;
  tip.style.top = `${r.bottom + 6 + h > innerHeight && r.top - 6 - h > 0 ? r.top - 6 - h : r.bottom + 6}px`;
}
const hideTip = () => { tip.hidden = true; tipEl = null; };
const hover = () => matchMedia('(hover: hover)').matches;
document.addEventListener('mouseover', e => {
  const el = e.target.closest?.('.info');
  if (el && hover()) showTip(el);
  else if (tipEl && hover() && !e.target.closest?.('.tip')) hideTip();
});
// Clicking an icon toggles its explanation, without sorting the column or selecting the row.
document.addEventListener('click', e => {
  const el = e.target.closest('.info');
  if (el) { e.stopPropagation(); e.preventDefault(); tipEl === el && !tip.hidden && !hover() ? hideTip() : showTip(el); }
  else if (!e.target.closest('.tip')) hideTip();
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') hideTip();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('info')) { e.preventDefault(); showTip(e.target); }
});
addEventListener('scroll', hideTip, true);
addEventListener('resize', hideTip);

// --- Page ---

function render() {
  const [k, d] = st.sort[st.kind];
  const rows = filtered().sort((a, b) => {
    const x = k === 'name' ? a.name : k === 'type' ? val(a.type) : a[k], y = k === 'name' ? b.name : k === 'type' ? val(b.type) : b[k];
    if (x == null || x === '') return 1;
    if (y == null || y === '') return -1;
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * d || b.ratings - a.ratings;
  });
  $('#count').textContent = t('count')(rows.length, items().length, st.kind);
  renderTable(rows);
  renderCompare();
}

function setKind(k) {
  st.kind = k;
  document.querySelectorAll('#kind button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  $('#q').placeholder = t('search')[k];
  hideTip(); writeHash(); buildFilters(); render();
}

// Writes every text of the page in the current language.
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t(el.dataset.t); });
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  $('#sub').textContent = t('sub')(DATA.rubber.length, DATA.blade.length);
  $('#updinfo').textContent = t('updated')(new Date(DATA.generated).toLocaleDateString(l === 'it' ? 'it-IT' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' }));
  setKind(st.kind);
}

$('#kind').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b && b.dataset.k !== st.kind) setKind(b.dataset.k); });
$('#lang').addEventListener('click', e => { const b = e.target.closest('button[data-l]'); if (b && b.dataset.l !== lang) { store.set('lang', b.dataset.l); setLang(b.dataset.l); } });
$('#q').addEventListener('input', e => { st.q = e.target.value; render(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

setLang(lang);
</script>
</body>
</html>
